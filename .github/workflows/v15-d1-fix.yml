name: V15 D1 Fix
on:
  push:
    branches:
      - feat/v15-visual-polish
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v15-visual-polish
          fetch-depth: 0
      - name: Restore readable dashboard width
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'V15-10: preserve readable dashboard width' experience-refinement.css; then exit 0; fi
          cat <<'EOF' >> experience-refinement.css
          
          /* V15-10: preserve readable dashboard width while compacting internal content density. */
          body:not(.login-open) main{max-width:1180px;}
          EOF
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify contracts
        run: |
          npm run quality
          npm run release:check
          git diff --check
          test "$(git status --porcelain | awk '{print $2}' | grep -v '^\.github/workflows/v15-d1-fix.yml$' || true)" = "experience-refinement.css"
      - name: Commit D1 fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experience-refinement.css
          git commit -m 'fix(v15): preserve readable dashboard width'
          git push origin HEAD:feat/v15-visual-polish

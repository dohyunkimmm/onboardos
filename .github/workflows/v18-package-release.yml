name: v18 package canonical release

on:
  push:
    branches:
      - release/v18.0.0
    paths:
      - '.github/workflows/v18-package-release.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v18.0.0
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Synchronize v18 canonical release artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm version 18.0.0 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          import json, re

          release_path = Path('release.json')
          release = json.loads(release_path.read_text())
          release['version'] = '18.0.0'
          release['releaseClass'] = 'task-clarity-product-experience'
          release['scope'] = 'design-only-task-clarity-execution-hierarchy'
          release['businessFlowChanged'] = False
          release['releaseStatus'] = 'verified'
          assets = release['evidenceContract']['releaseAssets']
          assets = ['ONBOARD_OS_v18.0.0_P6_production_demo.mp4' if item.startswith('ONBOARD_OS_v') and item.endswith('_P6_production_demo.mp4') else item for item in assets]
          release['evidenceContract']['releaseAssets'] = assets
          release_path.write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n')

          version_path = Path('version.txt')
          version = version_path.read_text()
          version = re.sub(r'^ONBOARD·OS v\d+\.\d+\.\d+$', 'ONBOARD·OS v18.0.0', version, flags=re.M)
          version = re.sub(r'^releaseClass=.*$', 'releaseClass=task-clarity-product-experience', version, flags=re.M)
          version = re.sub(r'^scope=.*$', 'scope=design-only-task-clarity-execution-hierarchy', version, flags=re.M)
          version = re.sub(r'^releaseStatus=.*$', 'releaseStatus=verified', version, flags=re.M)
          version_path.write_text(version)

          demo_path = Path('production-demo.html')
          demo = demo_path.read_text().replace('v17.0.0', 'v18.0.0')
          demo_path.write_text(demo)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          new_block = '> **Portfolio release — v18.0.0 / P6 Production verified.** P6에서 동결한 제품 기능과 사용자·관리자 Business Flow는 그대로 유지하면서, 첫 viewport를 Current Task / Next Action 중심으로 재정렬하고 공통 라이선스를 compact entitlement로 낮춰 직무별 의사결정과 다음 행동이 더 빠르게 보이도록 개선했습니다. Role card의 status·SLA·CTA scan hierarchy를 정렬하고, 신청 Modal은 SLA·예상 지급일을 우선 노출하며, 사용자 신청현황과 관리자 queue는 요청번호 → 상태/SLA → 처리 Action → History 순으로 execution hierarchy를 강화했습니다. Desktop/Tablet/Mobile, focus, reduced-motion, forced-colors와 기존 P6 state/SLA/role-isolation 계약은 유지했으며 JavaScript business logic, catalog data, request-state machine은 변경하지 않았습니다. 정식 기준은 [GitHub Release v18.0.0](https://github.com/dohyunkimmm/onboardos/releases/tag/v18.0.0)과 공개 Verification Evidence로 고정합니다.'
          readme, count = re.subn(r'^> \*\*Portfolio release — v17\.0\.0 / P6 Production verified\.\*\*.*$', new_block, readme, count=1, flags=re.M)
          if count != 1:
              raise SystemExit('README portfolio release block changed')
          readme = readme.replace('영상 원본은 v17.0.0 GitHub Release asset으로 유지합니다.', '영상 원본은 v18.0.0 GitHub Release asset으로 유지합니다.')
          readme_path.write_text(readme)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          section = '''## v18.0.0 — Task Clarity & Product Experience — 2026-09-18

P6에서 동결한 Business Flow와 상태 모델을 유지하면서, v17의 Product Identity 위에 task-first information hierarchy와 execution clarity를 적용했습니다. 기능 추가 없이 Overview → Common/Role Licenses → Request Modal → User/Admin Drawer 전 구간에서 현재 할 일, 상태·SLA, 처리 Action과 History의 우선순위를 더 빠르게 파악하도록 정리했습니다. JavaScript business logic, catalog data, request-state machine, SLA semantics, role isolation은 변경하지 않았습니다.

### Task clarity & execution hierarchy
- 첫 viewport를 Current Task / Next Action 중심으로 재정렬하고 5-step P6 progress contract 유지
- 전사 공통 라이선스를 compact entitlement presentation으로 낮춰 직무별 decision surface를 우선 노출
- Role card의 status / SLA / CTA scan lane과 action hierarchy 정렬
- 신청 Modal에서 SLA·예상 지급일을 secondary metadata보다 먼저 읽도록 information hierarchy 강화
- 사용자 신청현황과 관리자 queue를 ticket → status/SLA → action → history 순으로 재구성
- 390px mobile에서도 critical facts/action이 viewport와 touch target contract를 유지하도록 보정
- T1–T8 task-clarity 및 X1–X6 execution-hierarchy regression contract 추가
- 별도 execution hierarchy stylesheet는 initial mobile FCP 예산을 지키기 위해 post-login deferred layer로 유지

### Preserved contracts
- P6 feature freeze / `businessFlowChanged: false`
- R1–R8 / S1–S8 / U1–U8 / V1–V8 / D1–D8 / E1–E8
- Desktop/Mobile Lighthouse budget, Firefox/WebKit smoke, Production smoke, SHA-256 integrity

'''
          marker = '# Changelog\n\n'
          if not changelog.startswith(marker):
              raise SystemExit('CHANGELOG header changed')
          if '## v18.0.0 — Task Clarity & Product Experience' not in changelog:
              changelog = marker + section + changelog[len(marker):]
          changelog_path.write_text(changelog)

          walk_path = Path('docs/DEMO_WALKTHROUGH.md')
          walk = walk_path.read_text().replace('v17.0.0', 'v18.0.0')
          walk_path.write_text(walk)
          PY
      - name: Verify canonical release contract
        run: npm run release:check
      - name: Guard packaging scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'CHANGELOG.md'
            'README.md'
            'docs/DEMO_WALKTHROUGH.md'
            'package-lock.json'
            'package.json'
            'production-demo.html'
            'release.json'
            'version.txt'
          )
          [ "${#changed[@]}" -eq "${#expected[@]}" ] || { printf 'Unexpected file count:\n%s\n' "${changed[*]}"; exit 1; }
          for i in "${!expected[@]}"; do
            [ "${changed[$i]}" = "${expected[$i]}" ] || { printf 'Unexpected change: %s\n' "${changed[$i]}"; exit 1; }
          done
      - name: Commit packaged v18 release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md docs/DEMO_WALKTHROUGH.md package-lock.json package.json production-demo.html release.json version.txt
          git commit -m 'release(v18): synchronize canonical production metadata'
          git push origin HEAD:release/v18.0.0

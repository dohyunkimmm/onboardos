name: v6 closeout sync

on:
  push:
    branches:
      - release/v6.0.0-closeout
    paths:
      - .github/workflows/v6-closeout-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v6.0.0-closeout
      - name: Sync verified v6 close-out metadata
        run: python3 scripts/v6-closeout-sync.py
      - name: Commit close-out files and remove temporary helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v6-closeout-sync.yml scripts/v6-closeout-sync.py
          git add README.md CHANGELOG.md .github/release-request.json
          git commit -m 'Close out verified v6.0.0 release'
          git push origin HEAD:release/v6.0.0-closeout

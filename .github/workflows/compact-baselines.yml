name: Refresh compact catalog baselines (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - catalog.css
      - index.html
      - app.js
      - .github/workflows/compact-baselines.yml
permissions:
  contents: read
jobs:
  snapshots:
    if: github.event.pull_request.head.ref == 'ui/toolflow-catalog' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-node-dependencies
      - run: npx playwright install --with-deps chromium
      - name: Render current compact catalog snapshots
        run: npx playwright test tests/visual.spec.js --update-snapshots
      - name: Save generated baselines on an isolated branch for review
        shell: bash
        run: |
          set -euo pipefail
          git add tests/visual.spec.js-snapshots/*.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render ToolFlow compact catalog baselines for review"
          snapshot_branch="ci/toolflow-baselines-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${snapshot_branch}"
          echo "BASELINE_BRANCH=${snapshot_branch}"

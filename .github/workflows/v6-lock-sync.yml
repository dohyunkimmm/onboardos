name: v6 lock sync

on:
  push:
    branches: [release/v6.0.0-resilience]
    paths:
      - .github/workflows/v6-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v6.0.0-resilience
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit canonical lockfile
        run: |
          set -euo pipefail
          git diff --exit-code package-lock.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Sync package-lock to v6.0.0'
          git push origin HEAD:release/v6.0.0-resilience

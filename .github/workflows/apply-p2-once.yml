name: Apply P2 hardening once

on:
  push:
    branches: [feat/p2-hardening]
    paths:
      - '.github/workflows/apply-p2-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p2-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply P2 refactor
        run: python3 .github/scripts/p2_refactor.py

      - name: Validate JavaScript syntax
        run: |
          node --check js/state.js
          node --check js/analytics.js
          node --check js/a11y.js
          node --check app.js

      - name: Validate Vercel config
        run: python3 -m json.tool vercel.json >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Commit validated P2 changes
        run: |
          rm -f .github/scripts/p2_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: harden maintainability deployment and analytics"
          git push origin HEAD:feat/p2-hardening

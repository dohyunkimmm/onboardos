name: v16 Candidate Sync Safe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v16-candidate-sync-safe.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Reuse approved v16 design transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/v16-sync-fixed.yml').read_text()
          marker = '      - name: Apply v16 design layer and sync canonical metadata\n'
          start = source.index(marker)
          start = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('\n      - name: Install dependencies and Chromium', start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-v16.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-v16.sh

      - name: Add explicit candidate lifecycle contract safely
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = p => fs.readFileSync(p,'utf8');
          const write = (p,s) => fs.writeFileSync(p,s);
          const replaceLiteral = (source, oldText, newText) => {
            if(!source.includes(oldText)) throw new Error(`Expected text not found: ${oldText.slice(0,80)}`);
            return source.replace(oldText, () => newText);
          };

          const release = JSON.parse(read('release.json'));
          release.releaseStatus = 'candidate';
          write('release.json', JSON.stringify(release,null,2)+'\n');

          let version = read('version.txt');
          if(!/^releaseStatus=/m.test(version)) version = version.replace('releaseChannel=production\n','releaseChannel=production\nreleaseStatus=candidate\n');
          else version = version.replace(/^releaseStatus=.*$/m,'releaseStatus=candidate');
          write('version.txt',version);

          let contract = read('scripts/release-contract.js');
          contract = replaceLiteral(contract,
            "  if(release.businessFlowChanged !== false) fail('P6 release must keep businessFlowChanged=false');",
            "  if(release.businessFlowChanged !== false) fail('P6 release must keep businessFlowChanged=false');\n  if(!['candidate','verified'].includes(release.releaseStatus)) fail(`releaseStatus must be candidate or verified, found ${release.releaseStatus}`);"
          );
          contract = replaceLiteral(contract,
            "  if(!readme.includes(`Portfolio release — ${expectedTag} / P6 Production verified.`)) fail(`README current release block is not aligned to ${expectedTag}`);\n  if(!readme.includes(`releases/tag/${expectedTag}`)) fail(`README current release link is not aligned to ${expectedTag}`);",
            "  if(release.releaseStatus === 'verified'){\n    if(!readme.includes(`Portfolio release — ${expectedTag} / P6 Production verified.`)) fail(`README verified release block is not aligned to ${expectedTag}`);\n    if(!readme.includes(`releases/tag/${expectedTag}`)) fail(`README verified release link is not aligned to ${expectedTag}`);\n  } else {\n    if(!readme.includes(`Portfolio release — ${expectedTag} / P6 design-only candidate.`)) fail(`README candidate release block is not aligned to ${expectedTag}`);\n  }"
          );
          contract = replaceLiteral(contract,
            "  if(!/^releaseChannel=production$/m.test(versionText)) fail('version.txt must declare releaseChannel=production');",
            "  if(!/^releaseChannel=production$/m.test(versionText)) fail('version.txt must declare releaseChannel=production');\n  if(!versionText.includes(`releaseStatus=${release.releaseStatus}`)) fail(`version.txt releaseStatus is not aligned to ${release.releaseStatus}`);"
          );
          write('scripts/release-contract.js',contract);

          let docs = read('.github/workflows/docs-sync.yml');
          docs = replaceLiteral(docs,
            '          TAG="v${VERSION}"\n          RELEASE_NOTE="RELEASE-${TAG}.md"',
            '          TAG="v${VERSION}"\n          STATUS="$(node -p "require(\'./release.json\').releaseStatus")"\n          RELEASE_NOTE="RELEASE-${TAG}.md"'
          );
          docs = replaceLiteral(docs,
            '          grep -Fq "Portfolio release — ${TAG} / P6 Production verified." README.md',
            '          if [ "${STATUS}" = "verified" ]; then\n            grep -Fq "Portfolio release — ${TAG} / P6 Production verified." README.md\n            grep -Fq "releases/tag/${TAG}" README.md\n          elif [ "${STATUS}" = "candidate" ]; then\n            grep -Fq "Portfolio release — ${TAG} / P6 design-only candidate." README.md\n          else\n            echo "Unsupported releaseStatus: ${STATUS}" >&2\n            exit 1\n          fi'
          );
          docs = replaceLiteral(docs,'Documentation sync PASS: ${TAG}','Documentation sync PASS: ${TAG} · ${STATUS}');
          write('.github/workflows/docs-sync.yml',docs);
          NODE

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Refresh v16 visual baselines
        run: npm run test:visual:update
      - name: Verify candidate contract and visual regression
        run: |
          npm run quality
          npm run test:visual
      - name: Commit synchronized v16 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: consolidate v16 visual system without flow changes'
          git push origin HEAD:main

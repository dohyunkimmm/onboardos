name: V14 Release Sync

on:
  push:
    branches: [release/v14-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Materialize canonical v14 sync
        run: |
          npm version 14.0.0 --no-git-tag-version
          python3 .github/v14-sync.py
      - name: Validate canonical v14 sync
        run: |
          npm run quality
          npm run release:check
      - name: Verify isolated scope
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
              'CHANGELOG.md', 'README.md', 'RELEASE-v14.0.0.md',
              'experience-refinement.css', 'package-lock.json', 'package.json',
              'production-demo.html', 'release.json', 'version.txt'
          }
          rows = subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          changed = {row[3:] for row in rows if len(row) >= 4}
          if changed != allowed:
              raise SystemExit(f'Unexpected release-sync diff: {sorted(changed)}')
          PY
      - name: Commit canonical v14 sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md RELEASE-v14.0.0.md experience-refinement.css package.json package-lock.json production-demo.html release.json version.txt
          git commit -m 'release: synchronize canonical v14.0.0 artifacts'
          git push origin HEAD:release/v14-sync

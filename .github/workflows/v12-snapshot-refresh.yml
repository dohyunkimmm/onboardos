name: V12 Snapshot Refresh

on:
  push:
    branches: [feat/v12-experience-system]
    paths:
      - .github/workflows/v12-snapshot-refresh.yml

permissions:
  contents: write

jobs:
  refresh-dashboard-baselines:
    if: github.event.head_commit.message == 'Add temporary v12 snapshot refresh workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh dashboard snapshots only
        run: npx playwright test tests/visual.spec.js --grep "기본 대시보드 visual baseline" --update-snapshots
      - name: Verify snapshot-only output
        run: |
          git status --short
          test -n "$(git status --porcelain -- tests/visual.spec.js-snapshots/office-dashboard-desktop-chromium-linux.png)"
          test -n "$(git status --porcelain -- tests/visual.spec.js-snapshots/office-dashboard-mobile-chromium-linux.png)"
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v '^tests/visual.spec.js-snapshots/office-dashboard-desktop-chromium-linux.png$' | grep -v '^tests/visual.spec.js-snapshots/office-dashboard-mobile-chromium-linux.png$' || true)"
          test -z "$unexpected"
      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.js-snapshots/office-dashboard-desktop-chromium-linux.png tests/visual.spec.js-snapshots/office-dashboard-mobile-chromium-linux.png
          git commit -m "Refresh v12 dashboard visual baselines"
          git push origin HEAD:feat/v12-experience-system

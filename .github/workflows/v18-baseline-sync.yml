name: v18 visual baseline sync

on:
  push:
    branches: [v18-task-clarity-product-experience]
    paths:
      - '.github/workflows/v18-baseline-sync.yml'

permissions:
  contents: write

jobs:
  update-dashboard-baselines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore AA contrast for compact entitlement metadata
        shell: bash
        run: |
          rule='body:not(.login-open) .licenses.common-first .count{color:var(--vs-muted);}'
          if ! grep -Fq "$rule" visual-system.css; then
            printf '\n%s\n' "$rule" >> visual-system.css
          fi
      - name: Update approved v18 dashboard baselines
        run: npx playwright test tests/visual.spec.js --grep "기본 대시보드 visual baseline" --update-snapshots
      - name: Guard approved scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "tests/visual.spec.js-snapshots/office-dashboard-desktop-chromium-linux.png"
            "tests/visual.spec.js-snapshots/office-dashboard-mobile-chromium-linux.png"
            "visual-system.css"
          )
          if [ "${#changed[@]}" -ne 3 ]; then
            printf 'Unexpected changed files:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          for i in 0 1 2; do
            if [ "${changed[$i]}" != "${expected[$i]}" ]; then
              printf 'Unexpected changed files:\n'
              printf '%s\n' "${changed[@]}"
              exit 1
            fi
          done
      - name: Commit approved v18 baseline and contrast fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-system.css tests/visual.spec.js-snapshots/office-dashboard-desktop-chromium-linux.png tests/visual.spec.js-snapshots/office-dashboard-mobile-chromium-linux.png
          git commit -m "test(v18): approve dashboard baselines and AA contrast"
          git push

name: v18 visual baseline sync

on:
  push:
    branches: [v18-task-clarity-product-experience]
    paths:
      - 'visual-system.css'

permissions:
  contents: write

jobs:
  update-dashboard-baselines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Update approved v18 dashboard baselines
        run: npx playwright test tests/visual.spec.js --grep "기본 대시보드 visual baseline" --update-snapshots
      - name: Guard snapshot scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "tests/visual.spec.js-snapshots/office-dashboard-desktop-chromium-linux.png"
            "tests/visual.spec.js-snapshots/office-dashboard-mobile-chromium-linux.png"
          )
          if [ "${#changed[@]}" -ne 2 ] || [ "${changed[0]}" != "${expected[0]}" ] || [ "${changed[1]}" != "${expected[1]}" ]; then
            printf 'Unexpected changed files:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
      - name: Commit approved baselines
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.js-snapshots/office-dashboard-desktop-chromium-linux.png tests/visual.spec.js-snapshots/office-dashboard-mobile-chromium-linux.png
          git commit -m "test(v18): approve dashboard visual baselines"
          git push

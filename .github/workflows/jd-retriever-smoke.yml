name: JD Retriever smoke

on:
  push:
    branches: [jd-retriever-mcp-v1]
    paths:
      - 'services/jd-retriever-mcp/**'
      - '.github/workflows/jd-retriever-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for Render health
        shell: bash
        run: |
          set -euo pipefail
          URL='https://portfolio-jd-retriever-mcp.onrender.com/health'
          for i in $(seq 1 24); do
            body="$(curl -fsS --max-time 15 "$URL" 2>/dev/null || true)"
            if echo "$body" | grep -q '"ok":true'; then
              echo "$body"
              exit 0
            fi
            sleep 10
          done
          echo 'Health endpoint did not become ready' >&2
          exit 1

      - name: Verify MCP initialize handshake
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 30 \
            -X POST 'https://portfolio-jd-retriever-mcp.onrender.com/mcp' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"github-smoke","version":"1.0.0"}}}')"
          echo "$body"
          echo "$body" | grep -Eq 'serverInfo|jd-retriever'

      - name: Verify MCP tools are registered
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 30 \
            -X POST 'https://portfolio-jd-retriever-mcp.onrender.com/mcp' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
          echo "$body"
          echo "$body" | grep -q 'retrieve_jd'
          echo "$body" | grep -q 'retrieve_jd_batch'
          echo "$body" | grep -q 'jd_retriever_health'

      - name: Call MCP health tool
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 30 \
            -X POST 'https://portfolio-jd-retriever-mcp.onrender.com/mcp' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"jd_retriever_health","arguments":{}}}')"
          echo "$body"
          echo "$body" | grep -Eq 'jd-retriever-mcp|supported_platforms'

      - name: Exercise public retrieval path
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 30 \
            -X POST 'https://portfolio-jd-retriever-mcp.onrender.com/mcp' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"retrieve_jd","arguments":{"url":"https://example.com/","render":false}}}')"
          echo "$body"
          echo "$body" | grep -Eq 'platform.*generic'
          echo "$body" | grep -q 'route_attempts'
          echo "$body" | grep -q 'Example Domain'

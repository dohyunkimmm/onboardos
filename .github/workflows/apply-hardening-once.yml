name: Apply portfolio hardening once

on:
  push:
    branches: [feat/onboardos-hardening]
    paths:
      - ".github/workflows/apply-hardening-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/onboardos-hardening
          fetch-depth: 0

      - name: Apply targeted hardening
        run: python3 .github/scripts/apply_hardening.py

      - name: Prepare clean commit
        run: |
          rm -f SNAPSHOT_META.md SNAPSHOT_SHA256SUMS.txt
          rm -f .github/workflows/e2e.yml
          rm -f .github/scripts/apply_hardening.py
          rmdir .github/scripts 2>/dev/null || true
          cat > .gitignore <<'EOF'
          node_modules/
          playwright-report/
          test-results/
          EOF

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
          node --check playwright.config.js

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Commit hardened project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: harden onboarding prototype flows and QA"
          git push origin HEAD:feat/onboardos-hardening

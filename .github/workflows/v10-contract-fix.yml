name: V10 Contract Fix

on:
  push:
    branches:
      - feature/v10-visual-hierarchy-responsive-polish

permissions:
  contents: write

jobs:
  verify-and-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v10-visual-hierarchy-responsive-polish
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/v10-contract-fix.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify V1-V8 and D1-D8
        run: |
          npm run test:visual-system
          npm run test:design-polish
      - name: Refresh approved v10 visual baselines
        run: npm run test:visual:update
      - name: Commit compatibility fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add login-font-lock.css tests/visual.spec.js-snapshots
          git commit -m "Preserve v9 visual-state contracts in v10"
          git push origin HEAD:feature/v10-visual-hierarchy-responsive-polish

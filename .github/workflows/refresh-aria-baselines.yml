name: Temporary ARIA snapshot refresh
on:
  push:
    branches:
      - codex/product-review-1-7
    paths:
      - .github/workflows/refresh-aria-baselines.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.2
        with:
          node-version: '22'
      - name: Install dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-fund
          npx playwright install --with-deps chromium
      - name: Refresh changed accessible dialog and drawer contracts
        run: npx playwright test tests/aria.spec.js --update-snapshots
      - name: Commit ARIA snapshots and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-aria-baselines.yml
          git add tests/aria.spec.js-snapshots/
          git diff --cached --check
          git commit -m "test(a11y): sync accessible request and admin snapshot contracts"
          git push origin HEAD:codex/product-review-1-7

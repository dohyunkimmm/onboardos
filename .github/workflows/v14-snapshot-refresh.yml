name: V14 Snapshot Refresh

on:
  push:
    branches:
      - feat/v14-operational-command-center
    paths:
      - .github/workflows/v14-snapshot-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Refresh approved v14 visual baselines
        run: npx playwright test tests/visual.spec.js --project=desktop-chromium --project=mobile-chromium --update-snapshots
      - name: Verify exact snapshot scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            "tests/visual.spec.js-snapshots/office-dashboard-desktop-chromium-linux.png"
            "tests/visual.spec.js-snapshots/office-dashboard-mobile-chromium-linux.png"
            "tests/visual.spec.js-snapshots/request-modal-desktop-chromium-linux.png"
            "tests/visual.spec.js-snapshots/request-modal-mobile-chromium-linux.png"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
      - name: Commit approved v14 baselines
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.js-snapshots/
          git commit -m "test(v14): refresh approved visual baselines"
          git push origin HEAD:feat/v14-operational-command-center

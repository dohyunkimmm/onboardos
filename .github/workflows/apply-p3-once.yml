name: Apply P3 quality hardening once

on:
  push:
    branches: [feat/p3-quality-gates-final]
    paths:
      - '.github/workflows/apply-p3-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3-quality-gates-final

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply P3 refactor
        run: python3 .github/scripts/p3_refactor.py

      - name: Install axe integration
        run: npm install --save-dev @axe-core/playwright

      - name: Fast quality gate
        run: |
          npm run quality
          node --check app.js
          node --check js/a11y.js
          node --check js/analytics.js
          node --check js/events.js
          node --check scripts/quality-check.js
          node --check scripts/serve.js
          python3 -m json.tool vercel.json >/dev/null

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate visual baselines
        run: npm run test:visual:update

      - name: Run complete QA suite
        run: npm run test:e2e

      - name: Commit validated P3 changes
        run: |
          rm -f .github/scripts/p3_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css vercel.json package.json package-lock.json playwright.config.js README.md js scripts tests .github/scripts/p3_refactor.py
          git commit -m "test: add accessibility CSP quality and visual gates"
          git push origin HEAD:feat/p3-quality-gates-final

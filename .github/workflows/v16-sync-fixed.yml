name: v16 Design Sync Fixed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v16-sync-fixed.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply v16 design layer and sync canonical metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > v16-visual-system.css <<'CSS'
          /* ONBOARD·OS v16 — Visual System Consolidation & Product Finish
             Design-only release. Business flow, data, state machine, SLA semantics,
             role isolation and request behavior remain frozen at P6. */
          :root{
            --v16-canvas:#090A0D;
            --v16-surface-soft:rgba(255,255,255,.032);
            --v16-line:rgba(255,255,255,.085);
            --v16-text:#F5F5F7;
            --v16-muted:rgba(224,225,231,.64);
            --v16-dim:rgba(224,225,231,.46);
            --v16-accent:#A78BFA;
            --v16-positive:#6EE7B7;
            --v16-warning:#F6C76D;
            --v16-danger:#FB8A9B;
            --v16-radius-xl:24px;
            --v16-radius-lg:18px;
            --v16-shadow-panel:0 26px 68px -50px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.025);
            --v16-shadow-raised:0 24px 54px -38px rgba(0,0,0,.9),0 0 0 1px rgba(167,139,250,.04);
            --v16-focus:0 0 0 3px rgba(167,139,250,.28);
          }
          body{background:var(--v16-canvas);color:var(--v16-text);}
          .bg-atmosphere::before{background:radial-gradient(48% 38% at 82% 4%,rgba(139,92,246,.09),transparent 72%),radial-gradient(44% 34% at 8% 0%,rgba(255,255,255,.03),transparent 74%),linear-gradient(180deg,#090A0D 0%,#0D0F14 50%,#12151C 100%);}
          .bg-grid{opacity:.72;background-size:72px 72px;}
          .login-screen{background:radial-gradient(52% 48% at 14% 12%,rgba(139,92,246,.13),transparent 70%),radial-gradient(42% 34% at 90% 10%,rgba(99,102,241,.07),transparent 72%),linear-gradient(135deg,#090A0D,#0D0F14 56%,#12151C);}
          .login-card{width:min(900px,100%);border-radius:var(--v16-radius-xl);border-color:var(--v16-line);background:linear-gradient(145deg,rgba(25,28,36,.975),rgba(15,17,22,.96));box-shadow:0 38px 90px -60px rgba(0,0,0,.95),0 0 0 1px rgba(167,139,250,.035),inset 0 1px 0 rgba(255,255,255,.03);gap:40px;}
          .login-brandline{margin-bottom:16px;}.login-eyebrow{color:var(--v16-muted);border-color:var(--v16-line);background:rgba(255,255,255,.018);}
          .login-card .login-title{font-size:31px;letter-spacing:-.035em;line-height:1.25;}.login-card p{color:var(--v16-muted);max-width:520px;}
          .scenario-list{gap:10px;}.scenario-item{color:var(--v16-muted);}.scenario-check{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:7px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.13);font-size:11px;}
          .login-panel{border-radius:var(--v16-radius-lg);background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.022));border-color:var(--v16-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.025);}.login-account{border-color:rgba(255,255,255,.07);}.google-btn{border-radius:12px;min-height:46px;box-shadow:0 12px 28px -24px rgba(0,0,0,.9);}.reviewer-entry{color:var(--v16-muted);}
          body:not(.login-open) .topbar{border-bottom-color:rgba(255,255,255,.06);background:rgba(9,10,13,.88);box-shadow:0 12px 32px -32px rgba(0,0,0,.95);}
          body:not(.login-open) #statusBtn{background:linear-gradient(135deg,rgba(99,102,241,.78),rgba(124,58,237,.68));border-color:rgba(199,185,255,.28);box-shadow:0 13px 30px -21px rgba(124,58,237,.88),inset 0 1px 0 rgba(255,255,255,.08);}
          body:not(.login-open) #adminBtn{background:var(--v16-surface-soft);border-color:var(--v16-line);}body:not(.login-open) #resetBtn,body:not(.login-open) #moreBtn{background:transparent;border-color:transparent;color:var(--v16-dim);}body:not(.login-open) #resetBtn:hover,body:not(.login-open) #moreBtn:hover{background:rgba(255,255,255,.045);color:var(--v16-text);}
          body:not(.login-open) main{max-width:1120px;padding-top:32px;}body:not(.login-open) .overview-panel{border-radius:var(--v16-radius-xl);border-color:var(--v16-line);background:radial-gradient(70% 110% at 100% 0%,rgba(139,92,246,.085),transparent 62%),linear-gradient(145deg,rgba(24,27,35,.975),rgba(14,16,21,.95));box-shadow:var(--v16-shadow-panel);}
          body:not(.login-open) .overview-panel .name-input{font-weight:760;letter-spacing:-.045em;}body:not(.login-open) .overview-panel .badge-id label,body:not(.login-open) .role-picker>label,body:not(.login-open) .emp-meta{color:var(--v16-dim);}body:not(.login-open) .role-meta-pill{background:rgba(110,231,183,.09);border:1px solid rgba(110,231,183,.10);}
          body:not(.login-open) .role-picker{background:rgba(255,255,255,.008);}body:not(.login-open) .role-tab{border-radius:11px;border-color:rgba(255,255,255,.07);background:rgba(255,255,255,.018);color:var(--v16-muted);}body:not(.login-open) .role-tab:hover{background:rgba(255,255,255,.045);color:var(--v16-text);}body:not(.login-open) .role-tab.active{background:rgba(167,139,250,.11);border-color:rgba(167,139,250,.27);color:#F4F0FF;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);}body:not(.login-open) .role-tab.exception:not(.active){color:rgba(246,199,109,.8);border-color:rgba(246,199,109,.15);}body:not(.login-open) .demo-preview-note{background:rgba(167,139,250,.027);border-left-color:rgba(167,139,250,.25);color:var(--v16-muted);}
          body:not(.login-open) .progress-wrap{background:rgba(5,6,9,.20);}body:not(.login-open) .progress-step.done{opacity:.62;}body:not(.login-open) .progress-step.done .step-circle{background:rgba(110,231,183,.14);border-color:rgba(110,231,183,.28);color:var(--v16-positive);}body:not(.login-open) .progress-step.done .step-label{color:rgba(110,231,183,.72);}body:not(.login-open) .progress-step.current .step-circle{background:linear-gradient(135deg,#6366F1,#8B5CF6);box-shadow:0 0 0 4px rgba(139,92,246,.12),0 10px 24px -16px rgba(139,92,246,.92);}body:not(.login-open) .progress-hint{color:var(--v16-muted);}
          body:not(.login-open) .tools-bar{border-radius:12px;border-color:var(--v16-line);background:rgba(12,14,18,.84);box-shadow:0 16px 36px -32px rgba(0,0,0,.95);}body:not(.login-open) .filter-chip{border-radius:9px;color:var(--v16-muted);}body:not(.login-open) .filter-chip.active{background:rgba(167,139,250,.105);border-color:rgba(167,139,250,.21);color:#F3EEFF;box-shadow:none;}
          body:not(.login-open) .licenses{border-radius:var(--v16-radius-xl);border-color:var(--v16-line);background:linear-gradient(160deg,rgba(255,255,255,.017),rgba(255,255,255,.006));box-shadow:var(--v16-shadow-panel);}body:not(.login-open) .section-head{border-bottom-color:rgba(255,255,255,.055);}body:not(.login-open) .section-head h2{font-weight:760;letter-spacing:-.035em;}body:not(.login-open) .section-head .count{color:var(--v16-dim);}
          body:not(.login-open) .card{border-radius:var(--v16-radius-lg);border-color:rgba(255,255,255,.075);background:linear-gradient(160deg,rgba(27,30,38,.91),rgba(16,18,23,.90));box-shadow:inset 0 1px 0 rgba(255,255,255,.02);}body:not(.login-open) .card:hover{transform:translateY(-1px);border-color:rgba(167,139,250,.20);background:linear-gradient(160deg,rgba(31,34,44,.95),rgba(18,20,26,.94));box-shadow:0 20px 46px -38px rgba(139,92,246,.34),inset 0 1px 0 rgba(255,255,255,.025);}body:not(.login-open) .logo-chip{border-radius:12px;border-color:rgba(255,255,255,.075);background:rgba(255,255,255,.04);}body:not(.login-open) .card-title{letter-spacing:-.015em;}body:not(.login-open) .card-cat,body:not(.login-open) .card-owner{color:var(--v16-dim);}body:not(.login-open) #roleGrid .card-owner{border-bottom-color:rgba(255,255,255,.055);}
          body:not(.login-open) #roleGrid .cta{border:1px solid rgba(167,139,250,.18);background:rgba(167,139,250,.095);color:#DDD2FF;box-shadow:none;font-weight:700;}body:not(.login-open) #roleGrid .cta:hover{background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.30);color:#fff;}body:not(.login-open) .status-pill{border:1px solid transparent;}body:not(.login-open) .status-auto,body:not(.login-open) .status-approved,body:not(.login-open) .status-completed{background:rgba(110,231,183,.075);border-color:rgba(110,231,183,.10);}body:not(.login-open) .status-request{background:rgba(246,199,109,.075);border-color:rgba(246,199,109,.10);}body:not(.login-open) .status-approval,body:not(.login-open) .status-rejected{background:rgba(251,138,155,.075);border-color:rgba(251,138,155,.10);}
          body:not(.login-open) .request-modal,body:not(.login-open) .action-modal,body:not(.login-open) .drawer{border-color:var(--v16-line);background:linear-gradient(155deg,rgba(24,27,35,.99),rgba(14,16,21,.985));box-shadow:var(--v16-shadow-raised);}body:not(.login-open) .request-modal,body:not(.login-open) .action-modal{border-radius:var(--v16-radius-xl);}body:not(.login-open) .drawer-head{border-bottom-color:rgba(255,255,255,.06);}body:not(.login-open) .modal-actions{border-top-color:rgba(255,255,255,.065);background:linear-gradient(180deg,rgba(21,24,31,.88),rgba(13,15,20,.995));}body:not(.login-open) .modal-actions .primary-btn,body:not(.login-open) .modal-actions .btn-primary{background:linear-gradient(135deg,#5B5FEF,#7C3AED);border-color:transparent;box-shadow:0 14px 30px -20px rgba(124,58,237,.85);}body:not(.login-open) .request-item,body:not(.login-open) .reason-item,body:not(.login-open) .request-note-view,body:not(.login-open) .action-info{border-color:rgba(255,255,255,.065);background:rgba(255,255,255,.025);}body:not(.login-open) .empty-state{border-color:rgba(167,139,250,.16);background:radial-gradient(70% 120% at 50% 0%,rgba(139,92,246,.06),transparent 70%),rgba(255,255,255,.009);}
          :where(a,button,input,textarea):focus-visible{outline:2px solid var(--v16-accent);outline-offset:2px;box-shadow:var(--v16-focus);}
          @media (max-width:768px){.login-card{padding:26px 21px;gap:24px;border-radius:22px;}.login-card .login-title{font-size:25px;}.login-panel{padding:18px;border-radius:16px;}body:not(.login-open) main{padding-top:17px;padding-inline:16px;}body:not(.login-open) .overview-panel,body:not(.login-open) .licenses{border-radius:20px;}body:not(.login-open) .section-head h2{font-size:18px;}body:not(.login-open) #roleGrid .card{border-radius:16px;}body:not(.login-open) .request-modal,body:not(.login-open) .action-modal{border-radius:20px;}}
          @media (max-width:420px){.login-screen{padding:12px;}.login-card{padding:23px 18px;}.login-card .login-title{font-size:23px;}body:not(.login-open) main{padding-inline:12px;}body:not(.login-open) .licenses.common-first,body:not(.login-open) .licenses.role-secondary{padding-inline:11px;}}
          @media (prefers-reduced-motion:reduce){.login-card,body:not(.login-open) .card{transition:none!important;}}
          @media (forced-colors:active){.login-card,body:not(.login-open) .overview-panel,body:not(.login-open) .licenses,body:not(.login-open) .card,body:not(.login-open) .request-modal,body:not(.login-open) .action-modal,body:not(.login-open) .drawer{border:1px solid CanvasText;box-shadow:none;}}
          CSS

          node <<'NODE'
          const fs = require('fs');
          const read = p => fs.readFileSync(p,'utf8');
          const write = (p,s) => fs.writeFileSync(p,s);
          const pkg = JSON.parse(read('package.json')); pkg.version='16.0.0'; write('package.json',JSON.stringify(pkg,null,2)+'\n');
          const lock = JSON.parse(read('package-lock.json')); lock.version='16.0.0'; lock.packages[''].version='16.0.0'; write('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          const rel = JSON.parse(read('release.json')); rel.version='16.0.0'; rel.releaseClass='visual-system-consolidation-product-finish'; rel.scope='design-only-visual-system-consolidation-product-finish'; rel.syncedArtifacts=['version.txt','package.json','package-lock.json','production-demo.html','README.md','CHANGELOG.md','RELEASE-v16.0.0.md','docs/DEMO_WALKTHROUGH.md']; rel.evidenceContract.releaseAssets=rel.evidenceContract.releaseAssets.map(x=>x.replace('ONBOARD_OS_v15.0.0_P6_production_demo.mp4','ONBOARD_OS_v16.0.0_P6_production_demo.mp4')); write('release.json',JSON.stringify(rel,null,2)+'\n');
          write('version.txt',['ONBOARD·OS v16.0.0','P6 feature freeze','canonicalVersionSource=release.json','releaseChannel=production','releaseClass=visual-system-consolidation-product-finish','scope=design-only-visual-system-consolidation-product-finish','freeze=P6','businessFlowChanged=false','securityContract=S1-S8','uxContract=U1-U8','designSystemContract=V1-V8','designPolishContract=D1-D8','experienceRefinementContract=E1-E8','integrityManifest=integrity-assets.json',''].join('\n'));
          const integrity=JSON.parse(read('integrity-assets.json')); if(!integrity.requiredFiles.includes('v16-visual-system.css')) integrity.requiredFiles.splice(integrity.requiredFiles.indexOf('experience-refinement.css')+1,0,'v16-visual-system.css'); write('integrity-assets.json',JSON.stringify(integrity,null,2)+'\n');
          let index=read('index.html'); if(!index.includes('v16-visual-system.css')) index=index.replace('<link href="experience-refinement.css" rel="stylesheet"/>','<link href="experience-refinement.css" rel="stylesheet"/>\n<link href="v16-visual-system.css" rel="stylesheet"/>'); write('index.html',index);
          write('production-demo.html',read('production-demo.html').replaceAll('v15.0.0','v16.0.0').replaceAll('ONBOARD_OS_v15.0.0_P6_production_demo.mp4','ONBOARD_OS_v16.0.0_P6_production_demo.mp4'));
          let walk=read('docs/DEMO_WALKTHROUGH.md').replaceAll('v15.0.0','v16.0.0').replaceAll('ONBOARD_OS_v15.0.0_P6_production_demo.mp4','ONBOARD_OS_v16.0.0_P6_production_demo.mp4'); walk=walk.replace(/정식 Release 기준은 GitHub Release `v16\.0\.0`이며 target은 `[^`]+`입니다\./,'정식 Release 기준은 GitHub Release v16.0.0이며 target은 Production 검증 완료 후 immutable Release에 고정합니다.'); write('docs/DEMO_WALKTHROUGH.md',walk);
          let readme=read('README.md'); readme=readme.replace(/> \*\*Portfolio release — v15\.0\.0 \/ P6 Production verified\.\*\*[^\n]*/,'> **Portfolio release — v16.0.0 / P6 design-only candidate.** P6에서 동결한 제품 기능과 사용자·관리자 Business Flow는 그대로 유지하고, 로그인부터 post-login workspace까지 이어지는 visual language를 하나의 design system으로 통합했습니다. Surface·radius·border·elevation·typography hierarchy를 정리하고 Primary action / Selected state / Status state의 강조 역할을 분리했으며, 공통/직무별 카드·Modal·Drawer·Desktop/Tablet/Mobile composition을 같은 visual grammar로 정교화했습니다. JavaScript business logic, catalog data, request-state machine, SLA semantics, role isolation은 변경하지 않았습니다. Production 검증과 immutable Release 발행 후 verified 표기로 close-out합니다.'); readme=readme.replace('영상 원본은 `v15.0.0` GitHub Release asset으로 유지합니다.','영상 원본은 v16.0.0 GitHub Release asset으로 유지합니다.'); write('README.md',readme);
          const section=['## v16.0.0 — Visual System Consolidation & Product Finish — 2026-09-17','','P6에서 동결한 Business Flow와 상태 모델을 유지하면서 로그인부터 post-login workspace까지 분산되어 있던 visual language를 하나의 product design system으로 통합했습니다. v15의 density/spacing 개선을 반복하는 대신 surface·radius·border·elevation·typography·semantic state·interaction state를 단일 grammar로 정리했습니다. JavaScript business logic, catalog data, request-state machine, SLA semantics, role isolation은 변경하지 않았습니다.','','### Visual system consolidation','- 로그인 카드와 post-login workspace의 surface/radius/elevation 언어 통합','- Primary action / Selected state / Status state의 accent 역할 분리','- overview, role selector, progress, filter, common/role license cards의 공통 token 적용','- common compact card와 role execution card의 logo→title→category→owner→status→CTA grammar 통일','- request/action modal과 drawer의 elevated surface 및 sticky action-zone 통합','- mobile breakpoint의 surface radius, padding, typography composition 정교화','- v16-visual-system.css를 최종 override layer 및 Production integrity 대상으로 추가','','### Preserved contracts','- P6 feature freeze / businessFlowChanged: false','- R1–R8 / S1–S8 / U1–U8 / V1–V8 / D1–D8 / E1–E8',''].join('\n'); const changelog=read('CHANGELOG.md'); write('CHANGELOG.md',changelog.replace('# Changelog\n\n','# Changelog\n\n'+section+'\n'));
          write('RELEASE-v16.0.0.md',['# ONBOARD·OS v16.0.0 — Visual System Consolidation & Product Finish','','v16.0.0은 기능 확장 릴리스가 아니라 P6 Business Flow를 그대로 유지한 design-only visual system consolidation 릴리스입니다.','','## What changed','- 로그인과 post-login workspace의 surface/radius/elevation/typography grammar 통합','- Primary action / Selected state / Status state의 시각적 역할 분리','- Overview·role selector·progress·filter·license card의 공통 design token 체계 적용','- Common compact cards와 role execution cards의 정보 hierarchy 통일','- Modal·Drawer·Empty state 및 Desktop/Tablet/Mobile composition 정교화','- Production integrity 대상에 v16-visual-system.css 포함','','## What did not change','- JavaScript business logic','- SaaS catalog data','- request-state machine 및 SLA semantics','- role-isolated scenario state','- P6 feature scope','','## Verification contract','R1–R8, S1–S8, U1–U8, V1–V8, D1–D8, E1–E8, Chromium functional/WCAG/keyboard/ARIA/domain/role isolation/visual regression, Firefox/WebKit smoke, Desktop/Mobile Lighthouse, supply-chain, Production source integrity, Desktop Chromium + iPhone WebKit smoke를 모두 release evidence로 요구합니다.','','## Production close-out','Production target SHA, Vercel deployment, Main E2E run, Release workflow run, 36초 Production Demo와 immutable GitHub Release 결과는 Production 검증 완료 후 이 문서에 고정합니다.',''].join('\n'));
          if(fs.existsSync('RELEASE-v15.0.0.md')) fs.rmSync('RELEASE-v15.0.0.md');
          NODE

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Refresh visual baselines
        run: npm run test:visual:update
      - name: Verify quality and visual regression
        run: |
          npm run quality
          npm run test:visual
      - name: Commit synchronized v16 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: consolidate v16 visual system without flow changes'
          git push origin HEAD:main

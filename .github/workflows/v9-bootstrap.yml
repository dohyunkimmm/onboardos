name: Bootstrap v9 candidate

on:
  push:
    branches: [feature/v9-visual-usability-hardening]
    paths:
      - .github/workflows/v9-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Build v9 candidate
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/v9-bootstrap.js
          node --check /tmp/v9-bootstrap.js
          node /tmp/v9-bootstrap.js
      - name: Commit candidate atomically
        shell: bash
        run: |
          rm .github/workflows/v9-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build v9.0.0 visual system and usability candidate"
          git push

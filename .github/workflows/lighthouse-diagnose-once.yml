name: Diagnose P4 Lighthouse once

on:
  push:
    branches: [feat/p4-verification-matrix]
    paths:
      - '.github/workflows/lighthouse-diagnose-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p4-verification-matrix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize P4 files
        run: |
          python3 .github/scripts/p4_refactor.py
          python3 .github/scripts/p4_webkit_fix.py
          python3 .github/scripts/p4_perf_fix.py
      - name: Install dependencies
        run: npm install
      - name: Collect Lighthouse
        run: npx lhci collect --config=./lighthouserc.cjs
      - name: Print Lighthouse diagnostics
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = fs.readdirSync('.lighthouseci').filter(f => f.endsWith('.json'));
          for (const file of files) {
            const lhr = JSON.parse(fs.readFileSync(`.lighthouseci/${file}`, 'utf8'));
            const a = lhr.audits;
            const metric = id => ({score:a[id]?.score, value:a[id]?.numericValue, display:a[id]?.displayValue});
            console.log(JSON.stringify({
              file,
              performance:lhr.categories.performance.score,
              accessibility:lhr.categories.accessibility.score,
              bestPractices:lhr.categories['best-practices'].score,
              seo:lhr.categories.seo.score,
              fcp:metric('first-contentful-paint'),
              lcp:metric('largest-contentful-paint'),
              speedIndex:metric('speed-index'),
              tbt:metric('total-blocking-time'),
              cls:metric('cumulative-layout-shift'),
              interactive:metric('interactive'),
              renderBlocking:metric('render-blocking-resources'),
              totalBytes:metric('total-byte-weight'),
              networkRequests:a['network-requests']?.details?.items?.map(x => ({url:x.url, resourceType:x.resourceType, transferSize:x.transferSize})).slice(0,30)
            }, null, 2));
          }
          NODE
      - name: Assert Lighthouse budgets
        run: npx lhci assert --config=./lighthouserc.cjs

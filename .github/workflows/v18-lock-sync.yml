name: v18 lock sync

on:
  push:
    branches:
      - release/v18.0.0
    paths:
      - .github/workflows/v18-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v18.0.0
      - name: Package v18 canonical artifacts
        run: node .github/v18-package.js
      - name: Verify release contract
        run: npm run release:check
      - name: Commit canonical v18 metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md docs/DEMO_WALKTHROUGH.md package-lock.json package.json production-demo.html release.json version.txt
          git commit -m 'release(v18): synchronize canonical production metadata'
          git push origin HEAD:release/v18.0.0

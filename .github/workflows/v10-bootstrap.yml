          cat >> tests/visual-system.spec.js <<'TESTS'

// v10 D1-D8: visible hierarchy / density / responsive polish contract.
test('[D1] post-login product shell uses a wider structured hierarchy without changing the login baseline', async ({page}) => {
  await stabilize(page); await login(page);
  const main = page.locator('main');
  const overview = page.locator('.overview-panel');
  const mainStyle = await main.evaluate(el => getComputedStyle(el));
  const radius = await overview.evaluate(el => parseFloat(getComputedStyle(el).borderRadius));
  expect(parseFloat(mainStyle.maxWidth)).toBeGreaterThanOrEqual(1180);
  expect(radius).toBeGreaterThanOrEqual(20);
  await capture(page,'D1-dashboard-hierarchy.png');
});

test('[D2] typography establishes a clear name-section-body scale', async ({page}) => {
  await stabilize(page); await login(page);
  const nameSize = await page.locator('.name-input').evaluate(el => parseFloat(getComputedStyle(el).fontSize));
  const headingSize = await page.locator('.section-head h2').first().evaluate(el => parseFloat(getComputedStyle(el).fontSize));
  const metaSize = await page.locator('.emp-meta').evaluate(el => parseFloat(getComputedStyle(el).fontSize));
  expect(nameSize).toBeGreaterThan(headingSize);
  expect(headingSize).toBeGreaterThan(metaSize);
});

test('[D3] card grid rhythm and surfaces are visually consistent', async ({page}) => {
  await stabilize(page); await login(page);
  const grid = page.locator('#commonGrid');
  const gap = await grid.evaluate(el => parseFloat(getComputedStyle(el).columnGap));
  const cards = grid.locator('.card');
  expect(gap).toBeGreaterThanOrEqual(10);
  const radii = await cards.evaluateAll(nodes => nodes.map(el => parseFloat(getComputedStyle(el).borderRadius)));
  expect(new Set(radii).size).toBe(1);
  expect(radii[0]).toBeGreaterThanOrEqual(16);
  await capture(grid,'D3-card-rhythm.png');
});

test('[D4] semantic status pills keep color meaning while gaining explicit boundaries', async ({page}) => {
  await stabilize(page); await login(page);
  const pills = page.locator('.status-pill');
  const states = await pills.evaluateAll(nodes => nodes.slice(0,4).map(el => { const s=getComputedStyle(el); return {border:s.borderStyle,width:parseFloat(s.borderWidth),radius:parseFloat(s.borderRadius)}; }));
  expect(states.length).toBeGreaterThan(0);
  for(const state of states){ expect(state.border).not.toBe('none'); expect(state.width).toBeGreaterThanOrEqual(1); expect(state.radius).toBeGreaterThanOrEqual(10); }
});

test('[D5] role CTAs read as the primary action while passive status remains quieter', async ({page}) => {
  await stabilize(page); await login(page);
  const cta = page.locator('#roleGrid .cta').first();
  const status = page.locator('#commonGrid .status-pill').first();
  const ctaState = await visualState(cta);
  const statusState = await visualState(status);
  expect(ctaState.backgroundImage).toContain('linear-gradient');
  expect(statusState.backgroundImage).toBe('none');
  expect(parseFloat(await cta.evaluate(el => getComputedStyle(el).minHeight))).toBeGreaterThanOrEqual(38);
});

test('[D6] request modal uses clearer surface depth and action spacing', async ({page}) => {
  await stabilize(page); await login(page); await openOfficeRequest(page);
  const modal = page.locator('.request-modal');
  const radius = await modal.evaluate(el => parseFloat(getComputedStyle(el).borderRadius));
  const width = await modal.evaluate(el => el.getBoundingClientRect().width);
  expect(radius).toBeGreaterThanOrEqual(20);
  expect(width).toBeGreaterThanOrEqual(480);
  await capture(modal,'D6-modal-polish.png');
});

test('[D7] admin drawer reads as a dedicated work surface with stronger queue grouping', async ({page}) => {
  await stabilize(page); await login(page); await openOfficeRequest(page);
  await page.getByRole('button',{name:'신청 완료'}).click();
  await page.locator('#adminBtn').click();
  const drawer = page.locator('.drawer');
  await drawer.evaluate(async el => { await Promise.all(el.getAnimations().map(a => a.finished.catch(() => {}))); });
  const width = await drawer.evaluate(el => el.getBoundingClientRect().width);
  const radius = await page.locator('.request-item').first().evaluate(el => parseFloat(getComputedStyle(el).borderRadius));
  expect(width).toBeGreaterThanOrEqual(420);
  expect(radius).toBeGreaterThanOrEqual(16);
  await capture(drawer,'D7-drawer-polish.png');
});

test('[D8] tablet and mobile layouts preserve hierarchy without horizontal overflow', async ({page}) => {
  for(const width of [768,390]){
    await page.setViewportSize({width,height:820});
    await stabilize(page); await login(page);
    const overflow = await page.evaluate(() => document.documentElement.scrollWidth - innerWidth);
    expect(overflow).toBeLessThanOrEqual(1);
    const commonColumns = await page.locator('#commonGrid').evaluate(el => getComputedStyle(el).gridTemplateColumns.split(' ').length);
    const roleColumns = await page.locator('#roleGrid').evaluate(el => getComputedStyle(el).gridTemplateColumns.split(' ').length);
    expect(commonColumns).toBe(2);
    expect(roleColumns).toBe(1);
  }
});
TESTS


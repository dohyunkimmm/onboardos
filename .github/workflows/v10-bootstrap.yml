name: V10 Bootstrap

on:
  push:
    branches:
      - feature/v10-visual-hierarchy-responsive-polish

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v10-visual-hierarchy-responsive-polish
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Materialize v10 source
        run: python3 scripts/v10-materialize.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate v10 source
        run: |
          npm run quality
          npm run test:design-polish
      - name: Update approved visual baselines for v10
        run: npm run test:visual:update
      - name: Commit materialized v10 changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add login-font-lock.css release.json version.txt package.json package-lock.json playwright.config.js playwright.design-polish.config.js tests/design-polish.spec.js tests/visual.spec.js-snapshots scripts/release-contract.js scripts/release-evidence.js scripts/verification-summary.js
          git commit -m "Materialize v10 visual hierarchy and responsive polish"
          git push origin HEAD:feature/v10-visual-hierarchy-responsive-polish

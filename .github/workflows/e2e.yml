name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fast quality gate
        run: |
          npm run quality
          node --check app.js
          node --check js/a11y.js
          node --check js/analytics.js
          node --check js/events.js
          node --check scripts/quality-check.js
          node --check scripts/serve.js
          python3 -m json.tool vercel.json >/dev/null
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Functional, accessibility and visual regression tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

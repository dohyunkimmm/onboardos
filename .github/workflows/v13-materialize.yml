name: V13 Visual System Materializer

on:
  push:
    branches:
      - feat/v13-product-visual-system
    paths:
      - scripts/v13-materialize.js
      - .github/workflows/v13-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Append v13 visual system
        run: node scripts/v13-materialize.js
      - name: Quality gate
        run: npm run quality
      - name: Ensure only visual CSS changed in worktree
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "experience-refinement.css"
      - name: Commit materialized CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experience-refinement.css
          git commit -m "feat(v13): materialize product-grade visual system"
          git push origin HEAD:feat/v13-product-visual-system

name: V9 Visual System

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-system:
    name: Visual system / usability state gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run required visual system scenarios V1-V8
        run: |
          mkdir -p verification
          npm run test:visual-system
      - name: Build machine-readable visual system evidence
        run: node scripts/visual-system-summary.js verification/visual-system-playwright.json
      - name: Upload visual system evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-system-evidence-${{ github.sha }}
          path: |
            verification/visual-system-summary.json
            verification/visual-system-playwright.json
            verification/visual-system-screenshots/
          if-no-files-found: error
          retention-days: 30

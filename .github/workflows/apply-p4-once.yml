name: Materialize validated P4 files once

on:
  push:
    branches: [feat/p4-verification-matrix]
    paths:
      - '.github/workflows/apply-p4-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p4-verification-matrix

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize previously validated P4 files
        run: |
          python3 .github/scripts/p4_refactor.py
          python3 .github/scripts/p4_webkit_fix.py
          python3 .github/scripts/p4_perf_fix.py
          npm install

      - name: Commit non-workflow P4 files
        run: |
          rm -f .github/scripts/p4_refactor.py .github/scripts/p4_webkit_fix.py .github/scripts/p4_perf_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!.github/workflows/**'
          git status --short
          git commit -m "test: materialize validated P4 verification files"
          git push origin HEAD:feat/p4-verification-matrix

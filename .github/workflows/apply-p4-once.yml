name: Apply P4 verification hardening once

on:
  push:
    branches: [feat/p4-verification-matrix]
    paths:
      - '.github/workflows/apply-p4-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p4-verification-matrix

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply P4 verification files
        run: |
          python3 .github/scripts/p4_refactor.py
          python3 .github/scripts/p4_webkit_fix.py

      - name: Install dependencies
        run: npm install

      - name: Fast quality and syntax gate
        run: |
          npm run quality
          node --check app.js
          node --check js/a11y.js
          node --check js/analytics.js
          node --check js/events.js
          node --check scripts/quality-check.js
          node --check scripts/serve.js
          node --check playwright.config.js
          node --check playwright.cross-browser.config.js
          node --check playwright.production.config.js
          node --check lighthouserc.cjs
          node --check tests/domain.spec.js
          node --check tests/keyboard.spec.js
          node --check tests/aria.spec.js
          node --check tests/cross-browser.spec.js
          node --check tests/production.spec.js
          python3 -m json.tool vercel.json >/dev/null

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Generate ARIA snapshots
        run: npx playwright test tests/aria.spec.js --project=desktop-chromium --update-snapshots

      - name: Chromium functional / WCAG / keyboard / ARIA / domain / visual
        run: npm run test:e2e

      - name: Firefox and WebKit smoke
        run: npm run test:cross-browser

      - name: Lighthouse CI budgets
        run: npm run test:lighthouse

      - name: Commit validated P4 changes
        run: |
          rm -f .github/scripts/p4_refactor.py .github/scripts/p4_webkit_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!.github/workflows/apply-p4-once.yml'
          git add -u .github/scripts/p4_refactor.py .github/scripts/p4_webkit_fix.py
          git commit -m "test: add production domain WCAG lighthouse and cross-browser gates"
          git push origin HEAD:feat/p4-verification-matrix

# rerun: local HTTP CSP compatibility validation

name: v18 visual system consolidation

on:
  push:
    branches:
      - v18-visual-system-consolidation
    paths:
      - '.github/workflows/v18-consolidate-visual-system.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v18-visual-system-consolidation
          fetch-depth: 0
      - name: Consolidate canonical visual system
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          visual_path = Path('visual-system.css')
          execution_path = Path('execution-hierarchy.css')
          index_path = Path('index.html')
          events_path = Path('js/events.js')
          test_path = Path('tests/execution-hierarchy.spec.js')

          visual = visual_path.read_text()
          execution = execution_path.read_text().strip()
          visual_path.write_text(visual.rstrip() + '\n\n/* v18 execution hierarchy — consolidated into canonical visual system. */\n' + execution + '\n')

          index = index_path.read_text()
          link = '<link href="execution-hierarchy.css" id="executionHierarchyStylesheet" media="print" rel="stylesheet"/>\n'
          if index.count(link) != 1:
              raise SystemExit('execution hierarchy link contract changed')
          index_path.write_text(index.replace(link, ''))

          events = events_path.read_text()
          activation = "requestAnimationFrame(() => {\n  const executionHierarchyStylesheet = document.getElementById('executionHierarchyStylesheet');\n  if(executionHierarchyStylesheet) executionHierarchyStylesheet.media = 'all';\n});\n\n"
          if events.count(activation) != 1:
              raise SystemExit('execution hierarchy activation contract changed')
          events_path.write_text(events.replace(activation, ''))

          tests = test_path.read_text()
          replacement = '''test('[X1] canonical visual system owns execution hierarchy without a runtime override layer', async ({page}) => {
            await stabilize(page);
            const stylesheets = await page.evaluate(() => Array.from(document.querySelectorAll('link[rel="stylesheet"]')).map(link => link.getAttribute('href')));
            expect(stylesheets).toContain('visual-system.css');
            expect(stylesheets).not.toContain('execution-hierarchy.css');
            await expect(page.locator('#executionHierarchyStylesheet')).toHaveCount(0);
            const token = await page.evaluate(() => getComputedStyle(document.documentElement).getPropertyValue('--x18-surface').trim());
            expect(token).not.toBe('');
          });'''
          pattern = r"test\('\[X1\][\s\S]*?\n\}\);(?=\n\ntest\('\[X2\])"
          updated, count = re.subn(pattern, replacement, tests, count=1)
          if count != 1:
              raise SystemExit('X1 contract changed')
          test_path.write_text(updated)
          PY
          git rm execution-hierarchy.css
      - name: Guard consolidation scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'execution-hierarchy.css'
            'index.html'
            'js/events.js'
            'tests/execution-hierarchy.spec.js'
            'visual-system.css'
          )
          if [ "${#changed[@]}" -ne "${#expected[@]}" ]; then
            printf 'Unexpected consolidation file count:\n%s\n' "${changed[*]}"
            exit 1
          fi
          for i in "${!expected[@]}"; do
            if [ "${changed[$i]}" != "${expected[$i]}" ]; then
              printf 'Unexpected consolidation change: %s\n' "${changed[$i]}"
              exit 1
            fi
          done
          ! grep -q 'execution-hierarchy.css' index.html
          ! grep -q 'executionHierarchyStylesheet' js/events.js
          grep -q -- '--x18-surface:' visual-system.css
          grep -q 'without a runtime override layer' tests/execution-hierarchy.spec.js
      - name: Commit consolidation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-system.css index.html js/events.js tests/execution-hierarchy.spec.js execution-hierarchy.css
          git commit -m 'refactor(v18): consolidate execution hierarchy visual layer'
          git push origin HEAD:v18-visual-system-consolidation

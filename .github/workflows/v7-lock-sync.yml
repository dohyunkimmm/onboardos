name: v7 lock sync

on:
  push:
    branches: [release/v7.0.0-security-hardening]
    paths:
      - .github/workflows/v7-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v7.0.0-security-hardening
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lock metadata and remove one-time workflow
        run: |
          npm install --package-lock-only --ignore-scripts
          git rm .github/workflows/v7-lock-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Sync v7 package lock'
          git push origin HEAD:release/v7.0.0-security-hardening

name: Temporary dependency lock refresh
on:
  push:
    branches:
      - codex/product-review-1-7
    paths:
      - .github/workflows/dependency-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.2
        with:
          node-version: '22'
      - name: Resolve patched dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lock and security advisories
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Commit refreshed lock and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dependency-lock-refresh.yml
          git add package-lock.json
          git diff --cached --check
          git commit -m "fix(deps): resolve patched FTP and IP audit advisories"
          git push origin HEAD:codex/product-review-1-7

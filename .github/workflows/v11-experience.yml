name: V11 Experience Refinement

on:
  push:
    branches:
      - feature/v11-experience-refinement
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  experience:
    name: E1-E8 experience refinement gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E1-E8 experience refinement scenarios
        run: |
          mkdir -p verification/experience-refinement-screenshots
          npm run test:experience
      - name: Upload experience refinement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: experience-refinement-evidence-${{ github.sha }}
          path: |
            verification/experience-refinement-playwright.json
            verification/experience-refinement-screenshots/
          if-no-files-found: error
          retention-days: 30

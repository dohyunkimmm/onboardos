name: V11 Experience Refinement

on:
  push:
    branches:
      - feature/v11-experience-refinement
      - main
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    name: Apply v11 candidate once
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v11-experience-refinement' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v11-experience-refinement
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply scoped v11 UI/UX refinement
        run: node scripts/apply-v11-experience.js
      - name: Validate release/integrity and JavaScript
        run: |
          npm run quality
          node --check playwright.experience-refinement.config.js
          node --check tests/experience-refinement.spec.js
      - name: Refresh intentional visual baselines
        run: npm run test:visual:update
      - name: Preserve v9/v10 visual contracts
        run: |
          npm run test:visual-system
          npm run test:design-polish
      - name: Run E1-E8 experience refinement contract
        run: npm run test:experience
      - name: Commit generated v11 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply v11 experience refinement' || exit 0
          git push origin HEAD:feature/v11-experience-refinement

  experience:
    name: E1-E8 experience refinement gate
    if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E1-E8 experience refinement scenarios
        run: |
          mkdir -p verification/experience-refinement-screenshots
          npm run test:experience
      - name: Upload experience refinement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: experience-refinement-evidence-${{ github.sha }}
          path: |
            verification/experience-refinement-playwright.json
            verification/experience-refinement-screenshots/
          if-no-files-found: error
          retention-days: 30

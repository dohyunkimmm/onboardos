name: V14 Contract Patch

on:
  push:
    branches:
      - feat/v14-operational-command-center
    paths:
      - .github/v14-contract-patch.py
      - .github/workflows/v14-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch v14 modal radius contract
        run: python3 .github/v14-contract-patch.py
      - name: Quality gate
        run: npm run quality
      - name: Release contract
        run: npm run release:check
      - name: Verify isolation
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "experience-refinement.css"
      - name: Commit v14 contract patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experience-refinement.css
          git commit -m "fix(v14): preserve request modal hierarchy contract"
          git push origin HEAD:feat/v14-operational-command-center

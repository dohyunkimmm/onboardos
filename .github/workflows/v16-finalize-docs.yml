name: v16 final docs patch

on:
  push:
    branches: [v16-final-docs-production]
    paths:
      - .github/workflows/v16-finalize-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v16-final-docs-production
      - name: Patch representative docs and release marker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          old = '> **Portfolio release — v16.0.0 / P6 design-only candidate.**'
          new = '> **Portfolio release — v16.0.0 / P6 Production verified.**'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one README candidate marker, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_tail = 'Production 검증과 immutable Release 발행 후 verified 표기로 close-out합니다.'
          new_tail = 'Production 검증 완료 상태이며, 정식 기준은 [GitHub Release v16.0.0](https://github.com/dohyunkimmm/onboardos/releases/tag/v16.0.0)과 공개 Verification Evidence로 고정합니다.'
          if text.count(old_tail) != 1:
              raise SystemExit(f'expected exactly one README close-out marker, found {text.count(old_tail)}')
          readme.write_text(text.replace(old_tail, new_tail, 1))

          css = Path('v16-visual-system.css')
          css_text = css.read_text()
          old_css = '/* Production release marker: v16.0.0 design-only visual layer — verified merge. */'
          new_css = '/* Production release marker: v16.0.0 design-only visual layer — Production verified. */'
          if css_text.count(old_css) != 1:
              raise SystemExit(f'expected exactly one CSS release marker, found {css_text.count(old_css)}')
          css.write_text(css_text.replace(old_css, new_css, 1))
          PY
          git rm .github/workflows/v16-finalize-docs.yml
      - name: Commit branch-only finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md v16-visual-system.css .github/workflows/v16-finalize-docs.yml
          git commit -m 'docs: mark v16 Production verified'
          git push origin HEAD:v16-final-docs-production

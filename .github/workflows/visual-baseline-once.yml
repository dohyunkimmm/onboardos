name: Materialize login visual baselines once

on:
  push:
    branches: [feat/p4-verification-matrix]
    paths:
      - '.github/workflows/visual-baseline-once.yml'

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p4-verification-matrix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Refresh intended login baselines
        run: npx playwright test tests/visual.spec.js --grep "로그인 카드 visual baseline" --update-snapshots
      - name: Commit login baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.js-snapshots/login-card-*-chromium-linux.png
          git commit -m "test: refresh login visual baselines after deferred font load"
          git push origin HEAD:feat/p4-verification-matrix

name: V15 Sync Materialize

on:
  push:
    branches: [release/v15-sync]
    paths: [.github/workflows/v15-sync-materialize.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize v15 canonical sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          version = '15.0.0'
          tag = f'v{version}'
          release_class = 'visual-polish-density-refinement'
          scope = 'post-login-visual-polish-density-refinement'
          video = f'ONBOARD_OS_{tag}_P6_production_demo.mp4'

          p = Path('release.json')
          release = json.loads(p.read_text())
          release['version'] = version
          release['releaseClass'] = release_class
          release['scope'] = scope
          release['syncedArtifacts'] = [
              'version.txt', 'package.json', 'package-lock.json',
              'production-demo.html', 'README.md', 'CHANGELOG.md',
              'RELEASE-v15.0.0.md'
          ]
          assets = release['evidenceContract']['releaseAssets']
          release['evidenceContract']['releaseAssets'] = [video if x.startswith('ONBOARD_OS_v') else x for x in assets]
          p.write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n')

          Path('version.txt').write_text(
              'ONBOARD·OS v15.0.0\n'
              'P6 feature freeze\n'
              'canonicalVersionSource=release.json\n'
              'releaseChannel=production\n'
              'releaseClass=visual-polish-density-refinement\n'
              'scope=post-login-visual-polish-density-refinement\n'
              'freeze=P6\n'
              'businessFlowChanged=false\n'
              'securityContract=S1-S8\n'
              'uxContract=U1-U8\n'
              'designSystemContract=V1-V8\n'
              'designPolishContract=D1-D8\n'
              'experienceRefinementContract=E1-E8\n'
              'integrityManifest=integrity-assets.json\n'
          )

          p = Path('package.json')
          package = json.loads(p.read_text())
          package['version'] = version
          p.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          p = Path('production-demo.html')
          demo = p.read_text().replace('v14.0.0', 'v15.0.0')
          p.write_text(demo)

          p = Path('README.md')
          readme = p.read_text()
          block = (
              '> **Portfolio release — v15.0.0 / P6 Production verified.** P6에서 동결한 제품 기능과 사용자·관리자 Business Flow는 그대로 유지하고, v15.0.0은 post-login 화면의 visual polish와 density rhythm을 정교화했습니다. 공통 라이선스 compact density, overview→filter→license section의 세로 리듬, 카드 상태·CTA hierarchy, modal/drawer spacing과 tablet/mobile scanability를 다듬었으며 JavaScript business logic, catalog data, request-state machine, role isolation은 변경하지 않았습니다. R/S/U/V/D/E 1–8 계약과 Production integrity/smoke를 유지합니다. [GitHub Release v15.0.0](https://github.com/dohyunkimmm/onboardos/releases/tag/v15.0.0) · [Live Production](https://onboardos-rho.vercel.app/)'
          )
          readme = re.sub(r'> \*\*Portfolio release — v14\.0\.0 / P6 Production verified\.\*\*.*?(?=\n\n> 포트폴리오용)', block, readme, count=1, flags=re.S)
          readme = readme.replace('`v14.0.0` GitHub Release asset', '`v15.0.0` GitHub Release asset')
          p.write_text(readme)

          p = Path('CHANGELOG.md')
          changelog = p.read_text()
          section = '''## v15.0.0 — Visual Polish & Density Refinement — 2026-09-17

P6에서 동결한 Business Flow와 상태 모델은 유지하면서, v14 Operational Command Center 위에 visual polish와 density refinement를 적용했습니다. SSO 이후 첫 viewport의 정보 밀도를 재조정하고 공통 라이선스 영역을 compact system으로 정리해 직무별 다음 행동이 더 빨리 보이도록 개선했습니다. JavaScript business logic, catalog data, request-state machine, role isolation은 변경하지 않았습니다.

### Visual polish / density refinement
- 공통 라이선스의 과도한 vertical whitespace를 줄이고 compact card/section density로 정리
- overview → filter → common licenses → role licenses의 spacing rhythm과 scan hierarchy 정교화
- role card의 CTA/action depth와 status/SLA hierarchy는 유지하면서 주변 여백을 다듬음
- request modal/drawer의 action-zone spacing과 desktop/tablet/mobile responsive density 보정
- desktop dashboard 전체 높이와 mobile scroll depth를 줄여 첫 viewport에서 다음 업무가 더 빨리 드러나도록 개선
- 승인된 visual regression baseline은 desktop dashboard, mobile dashboard, desktop request modal 3개만 갱신

### Preserved contracts
- P6 feature freeze / `businessFlowChanged: false`
- R1–R8 Resilience/Recovery
- S1–S8 Security/Failure-containment
- U1–U8 Interaction UX/Accessibility
- V1–V8 Visual System/Usability
- D1–D8 Design Polish/Responsive Hierarchy
- E1–E8 Experience Refinement

'''
          if '## v15.0.0 — Visual Polish & Density Refinement' not in changelog:
              changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n' + section, 1)
          p.write_text(changelog)

          Path('RELEASE-v15.0.0.md').write_text('''# ONBOARD·OS v15.0.0 — Visual Polish & Density Refinement

v15.0.0은 기능 확장 릴리스가 아니라 P6 Business Flow를 그대로 유지한 visual polish / density refinement 릴리스입니다.

## What changed
- SSO 이후 첫 viewport의 정보 밀도와 section spacing rhythm 정리
- 공통 라이선스를 compact density system으로 전환해 과도한 여백 축소
- role-specific license card의 CTA/action hierarchy와 status scanability 유지·정교화
- request modal/drawer spacing 및 desktop/tablet/mobile responsive hierarchy 보정
- 검수된 visual regression baseline 3개만 갱신

## What did not change
- JavaScript business logic
- SaaS catalog data
- request-state machine 및 SLA semantics
- role-isolated scenario state
- P6 feature scope

## Verification contract
R1–R8, S1–S8, U1–U8, V1–V8, D1–D8, E1–E8, Chromium functional/WCAG/keyboard/ARIA/domain/role isolation/visual regression, Firefox/WebKit smoke, Desktop/Mobile Lighthouse, supply-chain, Production source integrity, Desktop Chromium + iPhone WebKit smoke를 모두 release evidence로 요구합니다.

## Production evidence
GitHub Release workflow가 Production-verified target SHA의 verification evidence를 검증하고 canonical Production을 Playwright Chromium으로 녹화한 정확히 36초 `ONBOARD_OS_v15.0.0_P6_production_demo.mp4`를 같은 immutable release에 포함합니다.
''')
          PY
          npm install --package-lock-only --ignore-scripts
          npm run quality
          npm run release:check
      - name: Verify sync-only diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          allowed='^(release.json|version.txt|package.json|package-lock.json|production-demo.html|README.md|CHANGELOG.md|RELEASE-v15.0.0.md)$'
          for f in "${changed[@]}"; do
            if ! [[ "$f" =~ $allowed ]]; then
              echo "Unexpected sync diff: $f" >&2
              exit 1
            fi
          done
          test "${#changed[@]}" -eq 8
      - name: Commit materialized sync and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v15-sync-materialize.yml
          git add release.json version.txt package.json package-lock.json production-demo.html README.md CHANGELOG.md RELEASE-v15.0.0.md .github/workflows/v15-sync-materialize.yml
          git commit -m 'release: materialize v15 canonical sync'
          git push origin HEAD:release/v15-sync

name: V15 Sync Materialize

on:
  push:
    branches:
      - release/v15-sync
    paths:
      - .github/workflows/v15-sync-materialize.yml
      - scripts/v15-sync.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize v15 canonical sync
        run: |
          python3 scripts/v15-sync.py
          npm install --package-lock-only --ignore-scripts
          npm run quality
          npm run release:check
      - name: Verify sync-only diff
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          allowed='^(release.json|version.txt|package.json|package-lock.json|production-demo.html|README.md|CHANGELOG.md|RELEASE-v15.0.0.md)$'
          for f in "${changed[@]}"; do
            if ! [[ "$f" =~ $allowed ]]; then
              echo "Unexpected sync diff: $f" >&2
              exit 1
            fi
          done
          test "${#changed[@]}" -eq 8
      - name: Commit materialized sync and remove one-shot files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v15-sync-materialize.yml scripts/v15-sync.py
          git add release.json version.txt package.json package-lock.json production-demo.html README.md CHANGELOG.md RELEASE-v15.0.0.md .github/workflows/v15-sync-materialize.yml scripts/v15-sync.py
          git commit -m 'release: materialize v15 canonical sync'
          git push origin HEAD:release/v15-sync

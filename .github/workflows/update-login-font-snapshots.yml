name: Update Login Font Snapshots

on:
  push:
    branches: [fix/login-font-metric-lock]
    paths:
      - .github/workflows/update-login-font-snapshots.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/login-font-metric-lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Refresh only login-card visual baselines
        run: npx playwright test tests/visual.spec.js -g "로그인 카드 visual baseline" --update-snapshots
      - name: Commit refreshed snapshots and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.js-snapshots/login-card-*.png
          git rm .github/workflows/update-login-font-snapshots.yml
          git commit -m "Update stable login visual baselines"
          git push origin HEAD:fix/login-font-metric-lock

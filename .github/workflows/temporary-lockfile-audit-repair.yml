name: Temporary lockfile advisory repair
on:
  push:
    branches:
      - fix/vercel-deploy-docs-and-main-sync
    paths:
      - .github/workflows/temporary-lockfile-audit-repair.yml
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'dohyunkimmm/onboardos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/vercel-deploy-docs-and-main-sync
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Repair only compatible vulnerable lockfile dependencies
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high
          git diff -- package-lock.json
      - name: Commit updated lockfile
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then echo 'No lockfile changes required'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): update vulnerable transitive audit dependencies'
          git push origin HEAD:fix/vercel-deploy-docs-and-main-sync

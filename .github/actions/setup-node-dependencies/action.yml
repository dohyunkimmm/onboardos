name: Setup Node dependencies
description: Shared pinned Node 22 setup, npm cache, and clean dependency install
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: npm
    - shell: bash
      run: npm ci
